name: App regression tests

on:
  pull_request:
  push:
    branches: ["codex/trust-and-workflow-audit-20260925"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest --junitxml=test-results.xml
        env:
          AUTH_DISABLED: "1"
      - run: python scripts/evaluate_analysis.py --output analysis-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            test-results.xml
            analysis-benchmark.json
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test --if-present
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r ../requirements.txt
      # Browser tooling is test-only; leave the application dependency lock intact.
      - run: npm install --prefix "$RUNNER_TEMP/browser-tools" --no-save --package-lock=false @playwright/test@1.58.2
      - run: node "$RUNNER_TEMP/browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Browser journeys with disposable synthetic data
        id: browsers
        run: NODE_PATH="$RUNNER_TEMP/browser-tools/node_modules" node "$RUNNER_TEMP/browser-tools/node_modules/@playwright/test/cli.js" test --config=playwright.config.cjs
        env:
          BROWSER_TEST_MODE: synthetic
      - name: Development browser validation with full diagnostics
        if: always() && steps.browsers.outcome != 'skipped'
        # Stop at the first diagnostic failure so its full error and trace are
        # uploaded before the job deadline rather than losing all evidence.
        run: NODE_PATH="$RUNNER_TEMP/browser-tools/node_modules" node "$RUNNER_TEMP/browser-tools/node_modules/@playwright/test/cli.js" test --config=playwright.config.cjs --max-failures=1 --global-timeout=480000
        env:
          BROWSER_TEST_MODE: synthetic
          BROWSER_DIAGNOSTIC: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-browser-results
          path: |
            web/playwright-report/
            web/test-results/
            web/diagnostics/
          retention-days: 7

